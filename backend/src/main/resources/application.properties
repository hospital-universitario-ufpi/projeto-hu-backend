spring.application.name=Hu backend

# Database Configuration (use environment variables in production)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/db?createDatabaseIfNotExists=true}
spring.datasource.username=${DB_USERNAME:admin}
spring.datasource.password=${DB_PASSWORD:admin}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate Configuration
spring.jpa.show-sql=${JPA_SHOW_SQL:true}
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# Server Configuration
server.port=${SERVER_PORT:8095}

# JWT Configuration (MUST be set via environment variable in production)
jwt.secret=${JWT_SECRET:ChaveJWTUltraSecretaHuBackendSegura2025TemporariaParaDesenvolvimento}

# API Documentation
spring.data.rest.base-path=/api
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.enabled=true

# Actuator Configuration (only health endpoint exposed)
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=when-authorized
springdoc.show-actuator=false

# Security Headers
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=${COOKIE_SECURE:false}

# Logging Configuration
logging.level.com.hu.backend.security=DEBUG
logging.level.org.springframework.security=DEBUG

# Comando pra criar o mysql no docker
# docker run -d --name mysql_hu -e MYSQL_ROOT_PASSWORD=admin -e MYSQL_USER=admin -e MYSQL_PASSWORD=admin -e MYSQL_DATABASE=db -p 3306:3306 mysql:8.0

# IMPORTANT SECURITY NOTES:
# 1. Change JWT_SECRET to a strong random value in production
# 2. Set DB_USERNAME and DB_PASSWORD environment variables
# 3. Set COOKIE_SECURE=true in production (HTTPS)
# 4. Set JPA_SHOW_SQL=false in production
# 5. Consider using spring profiles for different environments

